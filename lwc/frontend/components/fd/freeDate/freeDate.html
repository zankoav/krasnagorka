<template lwc:render-mode="light">
    <div class="free-date">
        <div class="free-date__title">
            <svg
                class="free-date__title-icon"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#3182ce"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            Поиск свободных номеров по датам:
        </div>
        <div class="free-date__input-block">
            <label for="free_date_from"
                ><span class="free-date__label-info">Дата заезда:</span>
                <input id="free_date_from" type="date" name="free_date_from" onchange={handleChange} />
            </label>
            <label for="free_date_to"
                ><span class="free-date__label-info">Дата выезда:</span>
                <input id="free_date_to" type="date" name="free_date_to" onchange={handleChange} />
            </label>
        </div>
        <div class="free-date__button-block">
            <button if:false={loading} class="free-date__button" onclick={handleFind}>Найти</button>
            <div if:true={loading} class="free-date__spinner-block">
                <div class="free-date__spinner"></div>
                <div class="free-date__spinner-text">Поиск номеров ...</div>
            </div>
        </div>
        <div if:true={link} class="free-date__link-block">
            <span class="free-date__link-label">Есть свободные номера: </span><a class="free-date__link" target="_blank" href={link}>посмотреть</a>
        </div>
        <div if:true={errorMessage} class="free-date__error-block">{errorMessage}</div>
        <template lwc:if={content}>
            <ul class="icons-description">
                <li class="icons__description-item">
                    <img
                        class="apartment__icon apartment__icon_mr-4px"
                        src="https://krasnagorka.by/wp-content/themes/krasnagorka/mastak/assets/icons/min-01.svg"
                        alt="icon" />&nbsp;&mdash;&nbsp;Минимальное количество человек
                </li>
                <li class="icons__description-item">
                    <img
                        class="apartment__icon apartment__icon_mr-4px"
                        src="https://krasnagorka.by/wp-content/themes/krasnagorka/mastak/assets/icons/max-01.svg"
                        alt="icon" />&nbsp;&mdash;&nbsp;Максимальное количество человек
                </li>
                <li class="icons__description-item">
                    <img
                        class="apartment__icon apartment__icon_mr-4px"
                        src="https://krasnagorka.by/wp-content/themes/krasnagorka/mastak/assets/icons/double-king-size-bed.svg"
                        alt="icon" />&nbsp;&mdash;&nbsp;Количество двухспальных кроватей
                </li>
                <li class="icons__description-item">
                    <img
                        class="apartment__icon apartment__icon_mr-4px"
                        src="https://krasnagorka.by/wp-content/themes/krasnagorka/mastak/assets/icons/single-king-size-bed.svg"
                        alt="icon" />&nbsp;&mdash;&nbsp;Количество односпальных кроватей
                </li>
                <li class="icons__description-item">
                    <img
                        class="apartment__icon apartment__icon_mr--4px"
                        src="https://krasnagorka.by/wp-content/themes/krasnagorka/mastak/assets/icons/toilet.svg"
                        alt="icon" />
                    <img
                        class="apartment__icon apartment__icon_mr-4px"
                        src="https://krasnagorka.by/wp-content/themes/krasnagorka/mastak/assets/icons/shower.svg"
                        alt="icon" />&nbsp;&mdash;&nbsp;Количество сан.узлов с душем
                </li>
                <li class="icons__description-item">
                    <img
                        class="apartment__icon apartment__icon_mr-4px"
                        src="https://krasnagorka.by/wp-content/themes/krasnagorka/mastak/assets/icons/toilet.svg"
                        alt="icon" />&nbsp;&mdash;&nbsp;Количество сан.узлов
                </li>
                <li class="icons__description-item">
                    <img
                        class="apartment__icon apartment__icon_mr-4px"
                        src="https://krasnagorka.by/wp-content/themes/krasnagorka/mastak/assets/icons/br-01.svg"
                        alt="icon" />&nbsp;&mdash;&nbsp;Количество спальных комнат
                </li>
                <li class="icons__description-item">
                    <img
                        class="apartment__icon apartment__icon_mr-4px"
                        src="https://krasnagorka.by/wp-content/themes/krasnagorka/mastak/assets/icons/triple-bed.svg"
                        alt="icon" />&nbsp;&mdash;&nbsp;Количество 3-спальных 2-ярусных кроватей
                </li>
            </ul>
            <div class="select-helper select-helper_header">
                <img
                    src="https://krasnagorka.by/wp-content/themes/krasnagorka/mastak/assets/icons/date-clicking-selecting.png"
                    class="select-helper__img"
                    alt="Выделение дат заезда и выезда" />
                <p class="select-helper__text">{content.textDescription}</p>
            </div>
        </template>
    </div>
</template>
