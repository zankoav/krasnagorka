<template>
    <div class="step-house">
        <div class="step-house__body" onhappyevents={handlerHappyEvents} onhappyeventsrange={handlerHappyEventsRange}>
            <z-loader if:true={loading}></z-loader>
            <template if:false={loading}>
                <templte if:false={settings.house}>
                    <h4 if:true={settings.package} lwc:dom="manual" class="step-house__subtitle"></h4>
                    <div class="step-house__fields">
                        <div class="step-house__field">
                            <label class="step-house__label step-house__label_required" for="date-start">Дата заезда</label>
                            <input
                                class="step-house__input step-house__date-input"
                                id="date-start"
                                type="date"
                                required
                                data-field="dateStart"
                                value={dateStartPicker}
                                onfocus={openNativeDatePicker}
                                onchange={datePickerChange} />
                        </div>
                        <div class="step-house__field">
                            <label class="step-house__label step-house__label_required" for="date-end">Дата выезда</label>
                            <input
                                class="step-house__input step-house__date-input"
                                id="date-end"
                                type="date"
                                required
                                data-field="dateEnd"
                                value={dateEndPicker}
                                onfocus={openNativeDatePicker}
                                onchange={datePickerChange} />
                        </div>
                        <div class="step-house__field">
                            <z-select
                                class="step-house__field-select"
                                required
                                label="Количество человек"
                                onchange={peopleChange}
                                options={peopleOptions}></z-select>
                        </div>
                        <div class="step-house__field">
                            <z-select
                                class="step-house__field-select"
                                label="Количество детей без спальных мест"
                                onchange={childChange}
                                options={childOptions}></z-select>
                        </div>
                    </div>
                    <div class="step-button-navigation__button-next-wrapper">
                        <a
                            href="javascript:void(0)"
                            onclick={fieldsNextButtonHandler}
                            class={classForNextButton}>Подобрать объект размещения</a>
                        <p if:true={fieldsError} class="step-button-navigation__error">{fieldsError}</p>
                    </div>
                    <div if:true={showAvailableCalendars} class="step-house__available-calendars">
                        <p if:true={availableCalendarsError} class="step-house__available-calendars-message">
                            {availableCalendarsError}
                        </p>
                        <div class="step-house__available-calendars-list">
                            <template for:each={availableCalendars} for:item="calendar">
                                <div
                                    key={calendar.id}
                                    class="step-house__available-calendar"
                                    data-id={calendar.id}
                                    role="button"
                                    tabindex="0"
                                    onclick={selectAvailableCalendar}
                                    onkeydown={selectAvailableCalendar}>
                                    <img if:true={calendar.picture} class="step-house__available-calendar-img" src={calendar.picture} alt={calendar.name} />
                                    <div class="step-house__available-calendar-content">
                                        <h4 class="step-house__available-calendar-title">{calendar.name}</h4>
                                        <div class="step-house__available-calendar-footer">
                                            <span class="step-house__available-calendar-description">
                                                До {calendar.peopleMaxCount} человек
                                            </span>
                                            <span if:true={calendar.price} class="step-house__available-calendar-price">
                                                <z-price-view price={calendar.price}></z-price-view>
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </templte>
                <template if:true={settings.house}>
                    <div class="step-house__row">
                        <div class="step-house__col">
                            <div class="step-house__info-group">
                                <img class="step-house__object-info-img" src={settings.house.picture} alt={settings.house.title} />
                                <z-select
                                    class="step-house__select step-house__calendars"
                                    required
                                    label="Домик"
                                    disabled={settings.eventTabId}
                                    onchange={calendarChange}
                                    options={settings.calendars}></z-select>
                            </div>
                            <z-select
                                class="step-house__select step-house__counts"
                                required
                                label={peopleCountLabel}
                                disabled={settings.eventId}
                                onchange={countChange}
                                options={settings.counts}></z-select>
                            <template if:true={showChilds}>
                                <z-select
                                    if:true={settings.eventId}
                                    class="step-house__select step-house__counts"
                                    required
                                    label="Количество детей (до 12 лет)"
                                    disabled={settings.eventId}
                                    onchange={countChange}
                                    options={eventChilds}></z-select>
                            </template>
                            <z-select
                                class="step-house__select"
                                label="Детей без спального места"
                                onchange={childCountChange}
                                options={settings.childCounts}></z-select>

                            <div class="step-house__booking">
                                <img src={bookingImg} alt="booking img" class="step-house__booking-icon" />
                                <div class="step-house__booking-dates">
                                    <div class="step-house__booking-from" data-date="Дата заезда:">{dateStart}</div>
                                    <div class="step-house__booking-from" data-date="Дата выезда:">{dateEnd}</div>
                                </div>
                            </div>
                            <div if:true={showDaylySales} class="step-house__sales">
                                <template for:each={settings.house.daysSales} for:item="item">
                                    <span key={item.sale} class="step-house__item-sale"
                                        >от <span class="step-house__item-number">{item.dayes}</span> ночей скидка
                                        <span class="step-house__item-percent"> -{item.sale}%</span>
                                    </span>
                                </template>
                            </div>
                            <div if:true={showPackageDaylySales} class="step-house__sales">
                                <template for:each={settings.package.daysSales} for:item="item">
                                    <span key={item.sale} class="step-house__item-sale"
                                        >от <span class="step-house__item-number">{item.dayes}</span> ночей скидка
                                        <span class="step-house__item-percent"> -{item.sale}%</span>
                                    </span>
                                </template>
                            </div>
                            <div if:true={settings.eventId} class="step-house__event">
                                <h3 class="step-house__event-title">{settings.eventModel.title}</h3>
                                <tab-line class="step-house__event-variant" title="Пакет" tooltip={eventOpportunities}>
                                    <span class="step-house__event-variant-value">{settings.eventModel.variant}</span>
                                </tab-line>
                            </div>
                            <div if:true={showEventMessageInfo} class="step-house__event-info">
                                <span class="step-house__event-info-start">!</span>{settings.eventTabMessageInfo}
                            </div>

                            <div class="step-house__happy-event" if:true={happyEvents.length}>
                                <div class="step-house__delimeter step-house__delimeter_small">МЕРОПРИЯТИЯ</div>
                                <template for:each={happyEvents} for:item="happyEvent">
                                    <div key={happyEvent.index} class="step-house__happy-event-item">
                                        <img class="step-house__happy-event-icon" src={happyEvent.img} alt="icon" />
                                        <span class="step-house__happy-event-description">{happyEvent.description}</span>
                                    </div>
                                </template>
                            </div>
                        </div>
                        <div class="step-house__col">
                            <z-calendar settings={settings}></z-calendar>
                        </div>
                    </div>
                    <div class="step-house__row step-house__row_opportunities">
                        <div lwc:if={showSoonEvents} class="step-house__col">
                            <div class="step-house__delimeter step-house__delimeter_small">Доступные акционные предложения на выбранные даты</div>
                            <z-loader if:true={soonEventsLoading}></z-loader>
                            <p
                                if:true={soonEventsUnavailable}
                                class="step-house__opportunities-item-description step-house__opportunities-item-description_center">
                                К сожалению, нет доступных акций по выбранным условиям. Попробуйте поменять кол-во человек или даты.
                            </p>
                            <div if:false={soonEventsLoading} class="step-house__opportunities-events">
                                <template for:each={soonEvents} for:item="soonEvent">
                                    <div
                                        key={soonEvent.id}
                                        class="step-house__opportunities-item"
                                        data-id={soonEvent.id}
                                        role="button"
                                        tabindex="0"
                                        onclick={loadSoonEvent}>
                                        <img class="step-house__opportunities-item-img" src={soonEvent.image} alt={soonEvent.title} />
                                        <div class="step-house__opportunities-item-content">
                                            <h4 class="step-house__opportunities-item-title step-house__opportunities-item-title_mb_8">
                                                {soonEvent.title}
                                            </h4>
                                            <p
                                                class="step-house__opportunities-item-description step-house__opportunities-item-description_mb_8"
                                                lwc:inner-html={soonEvent.description}></p>
                                            <div class="step-house__opportunities-item-footer">
                                                <span class="step-house__opportunities-item-description" lwc:inner-html={soonEvent.dates}></span>
                                                <z-price-view class="step-house__opportunities-item-price" price={soonEvent.price}></z-price-view>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                        <div lwc:if={fireEvents.length} class="step-house__col">
                            <div class="step-house__delimeter step-house__delimeter_small">Горящие предложения на выбранный объект</div>
                            <div class="step-house__opportunities-fire">
                                <template for:each={fireEvents} for:item="fireEvent">
                                    <div
                                        key={fireEvent.id}
                                        class="step-house__opportunities-item"
                                        data-id={fireEvent.id}
                                        role="button"
                                        tabindex="0"
                                        onclick={loadFireEvent}>
                                        <img class="step-house__opportunities-item-img" src={fireEvent.image} alt={fireEvent.title} />
                                        <div class="step-house__opportunities-item-content">
                                            <div class="step-house__opportunities-item-content-header">
                                                <span class="step-house__opportunities-item-title">{fireEvent.title}</span>
                                                <span
                                                    class="step-house__opportunities-item-description"
                                                    lwc:inner-html={fireEvent.description}></span>
                                            </div>
                                            <div class="step-house__opportunities-item-content-text">
                                                <span class="step-house__opportunities-item-dates">{fireEvent.dates}</span>
                                                <z-price-view class="step-house__opportunities-item-price" price={fireEvent.price}></z-price-view>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                    <div class="step-house__info-block" if:true={showPriceInfo}>
                        <div
                            class="step-house__delimeter step-house__delimeter_toggle"
                            role="button"
                            tabindex="0"
                            aria-expanded={priceInfoExpanded}
                            onclick={togglePriceInfo}
                            onkeydown={handlePriceInfoKeydown}>
                            информация о ценах в зависимости от сезона
                        </div>
                        <div class={priceInfoContentClass} aria-hidden={priceInfoHidden}>
                            <div class="step-house__info-content-inner">
                                <div class="step-house__row">
                                    <template if:true={settings.seasonsLoading}>
                                        <z-loader class="step-house__season-loading"></z-loader>
                                    </template>
                                    <template if:false={settings.seasonsLoading}>
                                        <div class="step-house__col">
                                            <z-house-info onchangeseason={seasonsChange} settings={settings}></z-house-info>
                                        </div>
                                        <div class="step-house__col">
                                            <z-season-details season={currentSeason} house={settings.house} settings={settings}></z-season-details>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </template>
        </div>
        <z-total-price if:true={settings.admin} settings={settings}></z-total-price>
        <z-step-button-navigation if:true={settings.house} error={error} settings={settings} onnext={nextButtonHandler}></z-step-button-navigation>
    </div>
</template>
